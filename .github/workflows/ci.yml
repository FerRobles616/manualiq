name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Tests
        run: pytest -q

      - name: Smoke evaluation
        env:
          DATABASE_URL: sqlite:///./ci-eval.db
          EMBEDDING_PROVIDER: hash
          MIN_SIMILARITY: "0.12"
        run: |
          alembic upgrade head
          python -m scripts.seed_corpus
          python -m scripts.evaluate \
            --dataset evals/smoke.jsonl \
            --check \
            --min-hit5 0.75 \
            --min-mrr 0.60 \
            --min-citation 0.70 \
            --min-refusal 0.80

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t manualiq:ci .

      - name: Run container
        run: |
          docker run -d --name manualiq-ci -p 8000:8000 \
            -e SEED_DEMO=true \
            -e EMBEDDING_PROVIDER=hash \
            -e MIN_SIMILARITY=0.12 \
            manualiq:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs manualiq-ci
          exit 1

      - name: Query the container
        run: |
          curl -fsS http://127.0.0.1:8000/api/query \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the maximum operating pressure of the H-200?"}' \
            | grep -q "180 bar"

      - name: Container logs
        if: always()
        run: docker logs manualiq-ci

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: manualiq
          POSTGRES_PASSWORD: manualiq
          POSTGRES_DB: manualiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manualiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install with PostgreSQL driver
        run: pip install -e ".[dev,postgres]"

      - name: Migrate and seed PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://manualiq:manualiq@localhost:5432/manualiq
          EMBEDDING_PROVIDER: hash
          MIN_SIMILARITY: "0.12"
        run: |
          alembic upgrade head
          python -m scripts.seed_corpus

      - name: PostgreSQL smoke evaluation
        env:
          DATABASE_URL: postgresql+psycopg://manualiq:manualiq@localhost:5432/manualiq
          EMBEDDING_PROVIDER: hash
          MIN_SIMILARITY: "0.12"
        run: |
          python -m scripts.evaluate \
            --dataset evals/smoke.jsonl \
            --check \
            --min-hit5 0.75 \
            --min-mrr 0.60 \
            --min-citation 0.70 \
            --min-refusal 0.80
